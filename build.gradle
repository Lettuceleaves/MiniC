plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'craken'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'com.fifesoft:rsyntaxtextarea:4.0.1'
    implementation 'org.jetbrains.jediterm:jediterm-core:3.76'
    implementation 'org.jetbrains.jediterm:jediterm-ui:3.76'
    implementation 'org.jetbrains.pty4j:pty4j:0.13.12'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.13'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-console-standalone:1.11.4'
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls', 'javafx.swing']
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// JavaExec 默认使用运行 Gradle 的 JVM；测试类按 21 编译，旧 JVM 扫描时会静默跳过全部测试。
tasks.withType(JavaExec).configureEach {
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
    jvmArgs '-Dfile.encoding=UTF-8'
}

// 当前 Windows 环境禁止 Gradle test worker 建立回环通道。使用 JUnit ConsoleLauncher
// 直接启动测试进程，保留同样的 Jupiter 发现与失败退出码，避免测试基础设施依赖回环 socket。
tasks.register('testWithoutWorker', JavaExec) {
    group = 'verification'
    description = '运行 JUnit 测试，不使用 Gradle test worker 回环连接'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.junit.platform.console.ConsoleLauncher'
    jvmArgs '--add-exports=java.desktop/sun.font=ALL-UNNAMED'
    args 'execute', '--scan-class-path', '--details=summary', '--disable-banner'
}

def registerTaggedTest = { String taskName, String tag, String taskDescription ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = taskDescription
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'org.junit.platform.console.ConsoleLauncher'
        args 'execute', '--scan-class-path', '--include-tag', tag, '--details=summary', '--disable-banner'
    }
}

registerTaggedTest('stdlibContract', 'stdlib-contract', '验证标准库清单、声明和能力契约')
registerTaggedTest('stdlibAbi', 'stdlib-abi', '验证 Windows x64 标准库 ABI')
registerTaggedTest('stdlibNative', 'stdlib-native', '验证标准库原生链接与运行')
registerTaggedTest('stdlibDebug', 'stdlib-debug', '验证标准库调试解释运行')
registerTaggedTest('stdlibParity', 'stdlib-parity', '验证原生与调试结果一致性')

tasks.register('stdlibCheck') {
    group = 'verification'
    description = '运行全部标准库验收测试'
    dependsOn 'stdlibContract', 'stdlibAbi', 'stdlibNative', 'stdlibDebug', 'stdlibParity'
}

tasks.named('check') {
    dependsOn tasks.named('stdlibCheck')
}

tasks.named('test') {
    enabled = false
    finalizedBy tasks.named('testWithoutWorker')
}

application {
    mainClass = 'craken.ui.Starter'
    applicationDefaultJvmArgs = [
            '--add-exports=java.desktop/sun.font=ALL-UNNAMED'
    ]
}

def stagedGraphviz = layout.buildDirectory.dir('graphviz-staging/default/graphviz')
tasks.register('stageGraphvizRuntime', Exec) {
    group = 'distribution'
    description = '校验锁定的官方 Graphviz 完整运行目录，并生成发布副本'
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', file('scripts/stage-graphviz-runtime.ps1').absolutePath,
            '-ProjectRoot', projectDir.absolutePath
    // Always verify the source bytes, including when the staging directory already exists.
}
distributions {
    main {
        contents {
            from(stagedGraphviz) { into 'runtime/graphviz' }
        }
    }
}
['installDist', 'distZip', 'distTar'].each { taskName ->
    tasks.named(taskName) { dependsOn tasks.named('stageGraphvizRuntime') }
}

tasks.register('runUi', JavaExec) {
    group = 'application'
    description = '启动 Craken Visual Workbench JavaFX UI'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'craken.ui.Starter'
    jvmArgs = [
            '--module-path', configurations.runtimeClasspath.asPath,
            '--add-modules', javafx.modules.join(','),
            '--add-exports=java.desktop/sun.font=ALL-UNNAMED',
            '-Dfile.encoding=UTF-8',
            '-Dsun.stdout.encoding=UTF-8',
            '-Dsun.stderr.encoding=UTF-8',
            '-Duser.language=en',
            '-Duser.country=US'
    ]
}

// 可见窗口的独立性能基准，不依赖编译器/调试器测试源能否编译。
def resizeBenchmarkClasses = layout.buildDirectory.dir('classes/java/resizeBenchmark')
tasks.register('compileEditorResizeBenchmark', JavaCompile) {
    dependsOn tasks.named('classes')
    source = fileTree('src/benchmark/java') { include '**/*.java' }
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory = resizeBenchmarkClasses
}

tasks.register('benchmarkEditorResize', JavaExec) {
    group = 'verification'
    description = '可见窗口中测量编辑器侧栏动画的布局与渲染完成节奏（非显示器呈现帧率）'
    dependsOn tasks.named('compileEditorResizeBenchmark')
    classpath = files(resizeBenchmarkClasses) + sourceSets.main.runtimeClasspath
    mainClass = 'craken.ui.frame.VisibleAnimationPerformance'
    jvmArgs '--module-path', configurations.runtimeClasspath.asPath,
            '--add-modules', javafx.modules.join(','),
            '--add-exports=java.desktop/sun.font=ALL-UNNAMED',
            '--add-exports=javafx.graphics/com.sun.javafx.perf=ALL-UNNAMED'
    systemProperty 'probe.renderTiming', 'true'
    systemProperty 'probe.measured', providers.gradleProperty('benchmarkIterations').getOrElse('18')
    systemProperty 'probe.initialDelay', '2000'
    if (providers.gradleProperty('benchmarkSplit').getOrElse('false').toBoolean()) args '--split'
    if (providers.gradleProperty('benchmarkEditorOnly').getOrElse('false').toBoolean()) args '--editor-only'
    if (providers.gradleProperty('benchmarkEmpty').getOrElse('false').toBoolean()) args '--empty'
    if (providers.gradleProperty('benchmarkScale').isPresent()) {
        args '--scale=' + providers.gradleProperty('benchmarkScale').get()
    }
}

def visualizationBenchmarkClasses = layout.buildDirectory.dir('classes/java/visualizationBenchmark')
tasks.register('compileVisualizationGraphBenchmark', JavaCompile) {
    dependsOn tasks.named('classes')
    source = fileTree('src/benchmark/java/craken/visualization/layout') { include '**/*.java' }
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory = visualizationBenchmarkClasses
}
tasks.register('benchmarkVisualizationGraph', JavaExec) {
    group = 'verification'
    description = 'Measure locked neato: 50/30, 100/250, per-part overhead and incremental displacement'
    dependsOn tasks.named('compileVisualizationGraphBenchmark')
    classpath = files(visualizationBenchmarkClasses) + sourceSets.main.runtimeClasspath
    mainClass = 'craken.visualization.layout.NativeGraphLayoutBenchmark'
    args providers.gradleProperty('graphvizRuntime').getOrElse(file('.local/tools/graphviz/16.1.0/Graphviz-16.1.0-win64').absolutePath),
            layout.buildDirectory.file('verification/graphviz-native-benchmark.json').get().asFile.absolutePath
}

// One manifest is shared by Gradle selection and the XML verifier. Stages are cumulative.
tasks.withType(JavaExec).configureEach {
    systemProperty 'craken.graphviz.runtime', providers.gradleProperty('graphvizRuntime').getOrElse(
            file('.local/tools/graphviz/16.1.0/Graphviz-16.1.0-win64').absolutePath)
}
def visualManifest = new groovy.json.JsonSlurper().parse(file('config/visualization/acceptance-stages.json'))
def visualStage = providers.gradleProperty('visualizationStage').getOrElse(visualManifest.stages.last().id)
def visualRunId = providers.gradleProperty('visualizationRunId').getOrElse('manual-' + UUID.randomUUID())
def visualIndex = visualManifest.stages.findIndexOf { it.id == visualStage }
def visualRequired = [:].withDefault { [] }
if (visualIndex >= 0) {
    visualManifest.stages.take(visualIndex + 1).each { stage ->
        stage.required.each { name, classes -> visualRequired[name].addAll(classes) }
    }
}
visualRequired.each { name, classes -> visualRequired[name] = classes.unique() }
def visualReports = layout.buildDirectory.dir('test-results/visualization/' + visualRunId)
def visualTags = [
        visualizationModelTest: 'visualization-model',
        visualizationLayoutTest: 'visualization-layout',
        visualizationAdapterTest: 'visualization-adapter',
        visualizationUiTest: 'visualization-ui'
]
def visualSuiteNames = (visualManifest.stages.collectMany { it.required.keySet() } + ['visualizationBaseline']).unique()
visualSuiteNames.each { suiteName ->
    tasks.register(suiteName, JavaExec) {
        group = 'verification'
        dependsOn tasks.named('classes'), tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'org.junit.platform.console.ConsoleLauncher'
        jvmArgs '--add-exports=java.desktop/sun.font=ALL-UNNAMED'
        if (suiteName in ['visualizationUiTest', 'visualizationRegression'])
            systemProperty 'craken.ui.test', 'true'
        def selectedClasses = visualRequired.containsKey(suiteName) ? visualRequired[suiteName] : []
        args 'execute', '--fail-if-no-tests', '--details=summary', '--disable-banner',
                '--reports-dir', visualReports.get().dir(suiteName).asFile.absolutePath
        if (suiteName == 'visualizationRegression') {
            selectedClasses.each { name -> args '--select-class', name }
        } else {
            args '--scan-class-path'
            if (visualTags.containsKey(suiteName)) args '--include-tag', visualTags[suiteName]
        }
        doFirst {
            if (visualIndex < 0) throw new GradleException('Unknown visualization stage: ' + visualStage)
            if (suiteName != 'visualizationBaseline' && selectedClasses.isEmpty())
                throw new GradleException('No required test classes for ' + suiteName)
        }
    }
}
tasks.register('visualizationVerifyReports', JavaExec) {
    group = 'verification'
    dependsOn visualRequired.keySet().collect { tasks.named(it) }
    dependsOn tasks.named('visualizationBaseline')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'craken.visualization.support.AcceptanceReportVerifier'
    args visualReports.get().asFile.absolutePath, 'visualizationBaseline|true|'
    visualRequired.each { name, classes -> args name + '|false|' + classes.join(',') }
}
tasks.register('visualizationCheck') {
    group = 'verification'
    description = 'Compile and verify all cumulative visualization acceptance reports'
    dependsOn tasks.named('visualizationVerifyReports')
    doFirst {
        if (!providers.gradleProperty('visualizationStage').isPresent()
                || !providers.gradleProperty('visualizationRunId').isPresent())
            throw new GradleException('visualizationStage and visualizationRunId are required')
    }
}
