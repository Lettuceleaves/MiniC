plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'minic'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'com.fifesoft:rsyntaxtextarea:4.0.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-console-standalone:1.11.4'
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls', 'javafx.swing']
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// 当前 Windows 环境禁止 Gradle test worker 建立回环通道。使用 JUnit ConsoleLauncher
// 直接启动测试进程，保留同样的 Jupiter 发现与失败退出码，避免测试基础设施依赖回环 socket。
tasks.register('testWithoutWorker', JavaExec) {
    group = 'verification'
    description = '运行 JUnit 测试，不使用 Gradle test worker 回环连接'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.junit.platform.console.ConsoleLauncher'
    args 'execute', '--scan-class-path', '--details=summary', '--disable-banner'
}

def registerTaggedTest = { String taskName, String tag, String taskDescription ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = taskDescription
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'org.junit.platform.console.ConsoleLauncher'
        args 'execute', '--scan-class-path', '--include-tag', tag, '--details=summary', '--disable-banner'
    }
}

registerTaggedTest('stdlibContract', 'stdlib-contract', '验证标准库清单、声明和能力契约')
registerTaggedTest('stdlibAbi', 'stdlib-abi', '验证 Windows x64 标准库 ABI')
registerTaggedTest('stdlibNative', 'stdlib-native', '验证标准库原生链接与运行')
registerTaggedTest('stdlibDebug', 'stdlib-debug', '验证标准库调试解释运行')
registerTaggedTest('stdlibParity', 'stdlib-parity', '验证原生与调试结果一致性')

registerTaggedTest('stlContract', 'stl-contract', '验证 C++ 算法库能力清单和生命周期契约')
registerTaggedTest('cppFrontend', 'cpp-frontend', '验证 C++ 语法树、诊断、头文件和编译入口')
registerTaggedTest('cppDifferential', 'cpp-differential', '使用同源码比较 MiniC native debug 和 C++17 参考编译器')
registerTaggedTest('nativePerfContract', 'native-perf-contract', '验证原生性能采样和报告工具')

tasks.register('stlCheck') {
    group = 'verification'
    description = '运行 C++ 算法兼容性验收测试'
    dependsOn 'stlContract', 'cppFrontend', 'cppDifferential', 'nativePerfContract'
}

tasks.register('nativePerf', JavaExec) {
    group = 'verification'
    description = '运行原生性能基线并保存 JSON 和 CSV；用 --args="--help" 查看选项'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'minic.benchmark.NativeBenchmarkMain'
}

tasks.register('stdlibCheck') {
    group = 'verification'
    description = '运行全部标准库验收测试'
    dependsOn 'stdlibContract', 'stdlibAbi', 'stdlibNative', 'stdlibDebug', 'stdlibParity'
}

tasks.named('check') {
    dependsOn tasks.named('stdlibCheck')
}

tasks.named('test') {
    enabled = false
    finalizedBy tasks.named('testWithoutWorker')
}

application {
    mainClass = 'minic.ui.Starter'
    applicationDefaultJvmArgs = [
            '--add-exports=java.desktop/sun.font=ALL-UNNAMED'
    ]
}

tasks.register('runUi', JavaExec) {
    group = 'application'
    description = '启动 MiniC Visual Workbench JavaFX UI'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'minic.ui.Starter'
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
    jvmArgs = [
            '--module-path', configurations.runtimeClasspath.asPath,
            '--add-modules', javafx.modules.join(','),
            '--add-exports=java.desktop/sun.font=ALL-UNNAMED',
            '-Dfile.encoding=UTF-8',
            '-Dsun.stdout.encoding=UTF-8',
            '-Dsun.stderr.encoding=UTF-8',
            '-Duser.language=en',
            '-Duser.country=US'
    ]
}

// Four-build STL performance tooling. Run explicitly after functional acceptance.
tasks.register('stlPerf', JavaExec) {
    group = 'verification'
    description = '四构建 STL 原生基准；固定提交，保存样本和内存指标；--args="--help" 查看配置'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'minic.benchmark.StlBenchmarkMain'
}
