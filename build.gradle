plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'minic'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.fxmisc.richtext:richtextfx:0.11.7'
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls', 'javafx.swing']
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'minic.Main'
}

tasks.register('runUi', JavaExec) {
    group = 'application'
    description = '启动 MiniC Visual Workbench JavaFX UI'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'minic.uilocal.MiniCWorkbenchLauncher'
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
    jvmArgs = [
            '--module-path', configurations.runtimeClasspath.asPath,
            '--add-modules', javafx.modules.join(','),
            '-Dfile.encoding=UTF-8',
            '-Dsun.stdout.encoding=UTF-8',
            '-Dsun.stderr.encoding=UTF-8',
            '-Duser.language=en',
            '-Duser.country=US'
    ]
}
