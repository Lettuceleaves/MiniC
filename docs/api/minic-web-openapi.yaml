openapi: 3.0.3
info:
  title: MiniC Web Workbench API
  version: 0.1.0
  description: Browser/server API for the MiniC Visual Workbench.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Server health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/compile/sessions:
    post:
      operationId: createCompileSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Compile session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/compile/sessions/{sessionId}:
    delete:
      operationId: closeCompileSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Compile session closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionClosedResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/compile/sessions/{sessionId}/source:
    post:
      operationId: updateCompileSource
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Source updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompileSnapshotResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/compile/sessions/{sessionId}/start:
    post:
      operationId: startCompileSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Compile observation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompileSnapshotResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/compile/sessions/{sessionId}/commands/{command}:
    post:
      operationId: runCompileCommand
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/Command"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandInputRequest"
      responses:
        "200":
          description: Compile command result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UiControlResultDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/compile/sessions/{sessionId}/state:
    get:
      operationId: getCompileState
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Compile current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UiCurrentStateDto"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/compile/sessions/{sessionId}/stage:
    get:
      operationId: getCompileStage
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Compile stage data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UiStageDataDto"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/compile/sessions/{sessionId}/global:
    get:
      operationId: getCompileGlobal
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Compile global data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UiGlobalDataDto"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/compile/sessions/{sessionId}/visual/current:
    get:
      operationId: getCompileVisual
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Compile visual data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UiStageVisualDto"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/compile/sessions/{sessionId}/snapshot:
    get:
      operationId: getCompileSnapshot
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Aggregate compile snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompileSnapshotResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/debug/sessions:
    post:
      operationId: createDebugSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Debug session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/debug/sessions/{sessionId}:
    delete:
      operationId: closeDebugSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Debug session closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionClosedResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/debug/sessions/{sessionId}/source:
    post:
      operationId: updateDebugSource
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Debug source updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebugSnapshotResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/debug/sessions/{sessionId}/start:
    post:
      operationId: startDebugSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Debug session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebugSnapshotResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/debug/sessions/{sessionId}/breakpoints:
    post:
      operationId: addDebugBreakpoint
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BreakpointRequest"
      responses:
        "200":
          description: Debug breakpoint added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UiDebugStateDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/debug/sessions/{sessionId}/breakpoints/{line}:
    delete:
      operationId: removeDebugBreakpoint
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/Line"
      responses:
        "200":
          description: Debug breakpoint removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UiDebugStateDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/debug/sessions/{sessionId}/commands/{command}:
    post:
      operationId: runDebugCommand
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/Command"
      responses:
        "200":
          description: Debug command result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UiDebugStateDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/debug/sessions/{sessionId}/state:
    get:
      operationId: getDebugState
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Debug state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UiDebugStateDto"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/debug/sessions/{sessionId}/views/metadata:
    get:
      operationId: getDebugMetadataView
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Debug metadata view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UiDebugMetadataViewDto"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/debug/sessions/{sessionId}/views/ast:
    get:
      operationId: getDebugAstView
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Debug AST view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UiDebugAstViewDto"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/debug/sessions/{sessionId}/views/ir:
    get:
      operationId: getDebugIrView
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Debug IR view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UiDebugIrViewDto"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/debug/sessions/{sessionId}/views/asm:
    get:
      operationId: getDebugAsmView
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Debug assembly view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UiDebugAsmViewDto"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/debug/sessions/{sessionId}/views/data-structure:
    get:
      operationId: getDebugDataStructureView
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Debug data-structure view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UiDebugDataStructureViewDto"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/debug/sessions/{sessionId}/snapshot:
    get:
      operationId: getDebugSnapshot
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Aggregate debug snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebugSnapshotResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/analysis/realtime:
    post:
      operationId: analyzeRealtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealtimeAnalysisRequest"
      responses:
        "200":
          description: Realtime analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UiRealtimeAnalysisDto"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Settings snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsSnapshot"
    patch:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdateRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/settings/themes:
    get:
      operationId: listThemes
      responses:
        "200":
          description: Available themes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeListResponse"
components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    Command:
      name: command
      in: path
      required: true
      schema:
        type: string
    Line:
      name: line
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    NotFound:
      description: Session or resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    Conflict:
      description: Command conflicts with current session state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    WebError:
      type: object
      required: [code, message, status]
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: integer
          format: int32
    CreateSessionRequest:
      type: object
      required: [sourceName, sourceText]
      properties:
        sourceName:
          type: string
        sourceText:
          type: string
    SessionCreatedResponse:
      type: object
      required: [sessionId, version]
      properties:
        sessionId:
          type: string
        version:
          type: integer
          format: int64
    SessionClosedResponse:
      type: object
      required: [sessionId, version, closed]
      properties:
        sessionId:
          type: string
        version:
          type: integer
          format: int64
        closed:
          type: boolean
    CommandInputRequest:
      type: object
      properties:
        standardInput:
          type: string
          default: ""
    BreakpointRequest:
      type: object
      required: [line]
      properties:
        line:
          type: integer
          format: int32
          minimum: 1
    RealtimeAnalysisRequest:
      type: object
      required: [sourceName, sourceText, version]
      properties:
        sourceName:
          type: string
        sourceText:
          type: string
        version:
          type: integer
          format: int64
    CompileSnapshotResponse:
      type: object
      required: [state, stage, global, visual]
      properties:
        state:
          $ref: "#/components/schemas/UiCurrentStateDto"
        stage:
          $ref: "#/components/schemas/UiStageDataDto"
        global:
          $ref: "#/components/schemas/UiGlobalDataDto"
        visual:
          $ref: "#/components/schemas/UiStageVisualDto"
    DebugSnapshotResponse:
      type: object
      required: [state, metadata, ast, ir, asm, dataStructure]
      properties:
        state:
          $ref: "#/components/schemas/UiDebugStateDto"
        metadata:
          $ref: "#/components/schemas/UiDebugMetadataViewDto"
        ast:
          $ref: "#/components/schemas/UiDebugAstViewDto"
        ir:
          $ref: "#/components/schemas/UiDebugIrViewDto"
        asm:
          $ref: "#/components/schemas/UiDebugAsmViewDto"
        dataStructure:
          $ref: "#/components/schemas/UiDebugDataStructureViewDto"
    SettingsSnapshot:
      type: object
      required: [theme, frameIntervalMillis, uiScale]
      properties:
        theme:
          type: string
        frameIntervalMillis:
          type: integer
          format: int64
        uiScale:
          type: number
          format: double
    SettingsUpdateRequest:
      type: object
      properties:
        theme:
          type: string
        frameIntervalMillis:
          type: integer
          format: int64
        uiScale:
          type: number
          format: double
    ThemeListResponse:
      type: object
      required: [currentTheme, themes]
      properties:
        currentTheme:
          type: string
        themes:
          type: array
          items:
            type: string
    UiControlResultDto:
      type: object
      required: [outcome, stage, title, description, diagnostics]
      properties:
        outcome:
          type: string
        stage:
          type: string
        title:
          type: string
        description:
          type: string
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/UiDiagnosticDto"
    UiCurrentStateDto:
      type: object
      required: [sourceName, currentStage, globalStepIndex, stageStepIndex, playbackMode, frameIntervalMillis, title, description, diagnostics, canNext, canPrevious, canPlay, canPlayFast, canPause, canReversePlay]
      properties:
        sourceName:
          type: string
        currentStage:
          type: string
        globalStepIndex:
          type: integer
          format: int64
        stageStepIndex:
          type: integer
          format: int64
        playbackMode:
          type: string
        frameIntervalMillis:
          type: integer
          format: int64
        sourceRange:
          nullable: true
          $ref: "#/components/schemas/UiSourceRangeDto"
        title:
          type: string
        description:
          type: string
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/UiDiagnosticDto"
        canNext:
          type: boolean
        canPrevious:
          type: boolean
        canPlay:
          type: boolean
        canPlayFast:
          type: boolean
        canPause:
          type: boolean
        canReversePlay:
          type: boolean
    UiStageDataDto:
      type: object
      required: [stage, completedSteps, totalSteps, completed, inputSummary, currentItem, accumulatedOutput, diagnostics]
      properties:
        stage:
          type: string
        completedSteps:
          type: integer
          format: int64
        totalSteps:
          type: integer
          format: int64
        completed:
          type: boolean
        inputSummary:
          type: array
          items:
            type: string
        currentItem:
          type: string
        accumulatedOutput:
          type: array
          items:
            type: string
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/UiDiagnosticDto"
    UiStageVisualDto:
      type: object
      required: [stage, title, summary, sourceText, ranges, tokens, astRoots, scopes, irLines, assemblyLines]
      properties:
        stage:
          type: string
        title:
          type: string
        summary:
          type: string
        sourceText:
          type: string
        ranges:
          type: array
          items:
            $ref: "#/components/schemas/UiSourceRangeDto"
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/UiLexerTokenVisualDto"
        astRoots:
          type: array
          items:
            $ref: "#/components/schemas/UiAstNodeVisualDto"
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/UiSemanticScopeVisualDto"
        irLines:
          type: array
          items:
            $ref: "#/components/schemas/UiIrLineVisualDto"
        assemblyLines:
          type: array
          items:
            $ref: "#/components/schemas/UiAssemblyLineVisualDto"
    UiGlobalDataDto:
      type: object
      required: [stageOrder, currentStage, globalStepIndex, playbackMode]
      properties:
        stageOrder:
          type: array
          items:
            type: string
        currentStage:
          type: string
        globalStepIndex:
          type: integer
          format: int64
        playbackMode:
          type: string
    UiRealtimeAnalysisDto:
      type: object
      required: [sourceName, sourceText, diagnostics, tokens, version]
      properties:
        sourceName:
          type: string
        sourceText:
          type: string
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/UiDiagnosticDto"
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/UiLexerTokenVisualDto"
        version:
          type: integer
          format: int64
    UiDiagnosticDto:
      type: object
      required: [severity, message, startOffset, endOffset]
      properties:
        severity:
          type: string
        message:
          type: string
        startOffset:
          type: integer
          format: int32
        endOffset:
          type: integer
          format: int32
    UiSourceRangeDto:
      type: object
      required: [sourceName, startOffset, endOffset]
      properties:
        sourceName:
          type: string
        startOffset:
          type: integer
          format: int32
        endOffset:
          type: integer
          format: int32
    UiSourceSpanDto:
      type: object
      required: [sourceName, startLine, startColumn, endLine, endColumn, startOffset, endOffset]
      properties:
        sourceName:
          type: string
        startLine:
          type: integer
          format: int32
        startColumn:
          type: integer
          format: int32
        endLine:
          type: integer
          format: int32
        endColumn:
          type: integer
          format: int32
        startOffset:
          type: integer
          format: int32
        endOffset:
          type: integer
          format: int32
    UiLexerTokenVisualDto:
      type: object
      required: [kind, lexeme, range, active]
      properties:
        kind:
          type: string
        lexeme:
          type: string
        range:
          $ref: "#/components/schemas/UiSourceRangeDto"
        active:
          type: boolean
    UiAstNodeVisualDto:
      type: object
      required: [id, kind, label, children, active]
      properties:
        id:
          type: string
        kind:
          type: string
        label:
          type: string
        range:
          nullable: true
          $ref: "#/components/schemas/UiSourceRangeDto"
        children:
          type: array
          items:
            $ref: "#/components/schemas/UiAstNodeVisualDto"
        active:
          type: boolean
    UiSemanticScopeVisualDto:
      type: object
      required: [id, label, symbols, children, active]
      properties:
        id:
          type: string
        label:
          type: string
        symbols:
          type: array
          items:
            type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/UiSemanticScopeVisualDto"
        active:
          type: boolean
    UiIrLineVisualDto:
      type: object
      required: [lineNumber, text, active]
      properties:
        lineNumber:
          type: integer
          format: int32
        text:
          type: string
        range:
          nullable: true
          $ref: "#/components/schemas/UiSourceSpanDto"
        active:
          type: boolean
    UiAssemblyLineVisualDto:
      type: object
      required: [lineNumber, text, section, active]
      properties:
        lineNumber:
          type: integer
          format: int32
        text:
          type: string
        section:
          type: string
        active:
          type: boolean
    UiDebugStateDto:
      type: object
      required: [sourceName, executionState, currentSnapshot, snapshots, events, breakpoints]
      properties:
        sourceName:
          type: string
        executionState:
          type: string
        currentSnapshot:
          $ref: "#/components/schemas/UiDebugSnapshotDto"
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/UiDebugSnapshotDto"
        events:
          type: array
          items:
            $ref: "#/components/schemas/UiDebugEventDto"
        breakpoints:
          type: array
          items:
            $ref: "#/components/schemas/UiDebugBreakpointDto"
    UiDebugSnapshotDto:
      type: object
      required: [id, functionName, sourceRange, frames, variables]
      properties:
        id:
          type: string
        functionName:
          type: string
        sourceRange:
          nullable: true
          $ref: "#/components/schemas/UiSourceSpanDto"
        frames:
          type: array
          items:
            $ref: "#/components/schemas/UiDebugFrameDto"
        variables:
          type: array
          items:
            $ref: "#/components/schemas/UiDebugVariableDto"
    UiDebugBreakpointDto:
      type: object
      required: [line, enabled]
      properties:
        line:
          type: integer
          format: int32
        enabled:
          type: boolean
    UiDebugEventDto:
      type: object
      required: [kind, message, snapshotId]
      properties:
        kind:
          type: string
        message:
          type: string
        snapshotId:
          type: string
    UiDebugFrameDto:
      type: object
      required: [index, functionName, sourceRange]
      properties:
        index:
          type: integer
          format: int32
        functionName:
          type: string
        sourceRange:
          nullable: true
          $ref: "#/components/schemas/UiSourceSpanDto"
    UiDebugVariableDto:
      type: object
      required: [name, type, value]
      properties:
        name:
          type: string
        type:
          type: string
        value:
          type: string
    UiDebugMetadataViewDto:
      type: object
      required: [executionState, stopReason, currentFunction, callStack, variables, stdout, stderr, breakpoints, events, timeline]
      properties:
        executionState:
          type: string
        stopReason:
          type: string
        currentFunction:
          type: string
        currentSourceRange:
          nullable: true
          $ref: "#/components/schemas/UiSourceSpanDto"
        callStack:
          type: array
          items:
            $ref: "#/components/schemas/UiDebugFrameDto"
        variables:
          type: array
          items:
            $ref: "#/components/schemas/UiDebugVariableDto"
        stdout:
          type: string
        stderr:
          type: string
        breakpoints:
          type: array
          items:
            $ref: "#/components/schemas/UiDebugBreakpointDto"
        events:
          type: array
          items:
            $ref: "#/components/schemas/UiDebugEventDto"
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/UiDebugTimelineItemDto"
    UiDebugAstViewDto:
      type: object
      required: [root, relatedIrIds, relatedAsmIds]
      properties:
        root:
          $ref: "#/components/schemas/UiAstNodeVisualDto"
        activeNode:
          nullable: true
          $ref: "#/components/schemas/UiDebugAstNodeDetailDto"
        relatedIrIds:
          type: array
          items:
            type: string
        relatedAsmIds:
          type: array
          items:
            type: string
    UiDebugAstNodeDetailDto:
      type: object
      required: [id, kind, label]
      properties:
        id:
          type: string
        kind:
          type: string
        label:
          type: string
    UiDebugIrViewDto:
      type: object
      required: [lines, currentInstructionId, explanation, operands]
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/UiIrLineVisualDto"
        currentInstructionId:
          type: string
        currentSourceRange:
          nullable: true
          $ref: "#/components/schemas/UiSourceSpanDto"
        explanation:
          type: string
        operands:
          type: array
          items:
            $ref: "#/components/schemas/UiDebugIrOperandDto"
    UiDebugIrOperandDto:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
    UiDebugAsmViewDto:
      type: object
      required: [lines, explanation, relatedIrIds]
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/UiAssemblyLineVisualDto"
        explanation:
          type: string
        relatedIrIds:
          type: array
          items:
            type: string
    UiDebugDataStructureViewDto:
      type: object
      required: [processSpace, visuals, warnings]
      properties:
        processSpace:
          $ref: "#/components/schemas/UiDebugProcessSpaceDto"
        visuals:
          type: array
          items:
            $ref: "#/components/schemas/UiDebugVisualStructureDto"
        warnings:
          type: array
          items:
            type: string
    UiDebugProcessSpaceDto:
      type: object
      required: [segments]
      properties:
        segments:
          type: array
          items:
            type: string
    UiDebugVisualStructureDto:
      type: object
      required: [id, kind, label, elements]
      properties:
        id:
          type: string
        kind:
          type: string
        label:
          type: string
        elements:
          type: array
          items:
            $ref: "#/components/schemas/UiDebugVisualElementDto"
    UiDebugVisualElementDto:
      type: object
      required: [id, label, value]
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: string
    UiDebugTimelineItemDto:
      type: object
      required: [snapshotId, label, active]
      properties:
        snapshotId:
          type: string
        label:
          type: string
        active:
          type: boolean
