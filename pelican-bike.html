<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车 · 2D SVG 动画</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 14px;
      padding: 24px 16px;
      background: linear-gradient(180deg, #8fd3f0 0%, #c9e9f8 45%, #eef8fd 100%);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    header { text-align: center; }

    h1 {
      margin: 0 0 4px;
      font-size: 1.45rem;
      font-weight: 600;
      color: #124d67;
    }

    header p {
      margin: 0;
      font-size: 0.88rem;
      color: #2d6b86;
    }

    .card {
      width: min(96vw, 940px);
      background: #ffffff;
      border-radius: 18px;
      padding: 10px;
      box-shadow: 0 18px 50px rgba(18, 70, 96, 0.25);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    /* ====== SVG 动画 ====== */
    .sun-rays, .cloud1, .cloud2, .cloud3, .birds, .scenery, .road-dash {
      transform-box: view-box;
    }

    .sun-rays {
      transform-origin: 112px 92px;
      animation: spin360 40s linear infinite;
    }

    .cloud1 { animation: drift1 62s linear infinite; animation-delay: -12s; }
    .cloud2 { animation: drift2 88s linear infinite; animation-delay: -30s; }
    .cloud3 { animation: drift3 112s linear infinite; animation-delay: -5s; }
    .birds { animation: birdsDrift 100s linear infinite; animation-delay: -35s; }
    .scenery { animation: scrollBush 9s linear infinite; }
    .road-dash { animation: dashRoad 1.1s linear infinite; }

    .wind {
      stroke-dasharray: 46 84;
      animation: windMove 1.3s linear infinite;
    }

    .blink {
      transform-box: fill-box;
      transform-origin: center;
      animation: blinkEye 4.6s infinite;
    }

    @keyframes spin360 { to { transform: rotate(360deg); } }
    @keyframes drift1 { to { transform: translateX(-1300px); } }
    @keyframes drift2 { to { transform: translateX(-1400px); } }
    @keyframes drift3 { to { transform: translateX(-1400px); } }
    @keyframes birdsDrift { to { transform: translateX(-1200px); } }
    @keyframes scrollBush { to { transform: translateX(-400px); } }
    @keyframes dashRoad { to { transform: translateX(-60px); } }
    @keyframes windMove { to { stroke-dashoffset: -130; } }

    @keyframes blinkEye {
      0%, 90%, 100% { transform: scaleY(1); }
      93% { transform: scaleY(0.12); }
      96% { transform: scaleY(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .sun-rays, .cloud1, .cloud2, .cloud3, .birds, .scenery,
      .road-dash, .wind, .blink { animation: none !important; }
    }
  </style>
</head>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const crankEl = $("crank"), pedalA = $("pedalA"), pedalB = $("pedalB");
      const footR = $("footR"), footL = $("footL");
      const legR = $("legR"), legL = $("legL");
      const kneeR = $("kneeR"), kneeL = $("kneeL");
      const spokesR = $("spokesR"), spokesF = $("spokesF");
      const rider = $("rider"), headGroup = $("headGroup");
      const wing = $("wing"), fish = $("fish");

      const BB = { x: 400, y: 340 };       // 中轴
      const RADIUS = 24;                   // 曲柄长度
      const L1 = 60, L2 = 64;              // 大腿 / 小腿长度
      const hipL = { x: 346, y: 249 };
      const hipR = { x: 366, y: 250 };
      const PIVOT = { x: 352, y: 246 };    // 身体摇摆支点（座垫处）

      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let t = 0, crank = 0, wheel = 0;
      let last = performance.now();

      const deg = (r) => r * 180 / Math.PI;

      function rotatePoint(p, c, a) {
        const cs = Math.cos(a), sn = Math.sin(a);
        return {
          x: c.x + (p.x - c.x) * cs - (p.y - c.y) * sn,
          y: c.y + (p.x - c.x) * sn + (p.y - c.y) * cs
        };
      }

      // 逆运动学：已知髋 H 与脚踝 F，求膝盖位置（膝盖朝前方弯曲）
      function knee(H, F) {
        let dx = F.x - H.x, dy = F.y - H.y;
        let d = Math.hypot(dx, dy);
        d = Math.min(Math.max(d, Math.abs(L1 - L2) + 0.5), L1 + L2 - 0.5);
        const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
        const h = Math.sqrt(Math.max(L1 * L1 - a * a, 0));
        const ux = dx / d, uy = dy / d;
        return { x: H.x + a * ux + h * uy, y: H.y + a * uy - h * ux };
      }

      const setT = (el, txt) => el.setAttribute("transform", txt);

      function update(now) {
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        if (!reduced) {
          t += dt;
          crank += 4.2 * dt;
          wheel += 4.2 * dt;
        }

        const th = crank;
        const ax = BB.x + RADIUS * Math.cos(th);
        const ay = BB.y + RADIUS * Math.sin(th);
        const bx = BB.x - RADIUS * Math.cos(th);
        const by = BB.y - RADIUS * Math.sin(th);

        const bob = 2.2 * Math.sin(2 * th);        // 蹬踏带来的上下颠簸
        const tilt = 1.6 * Math.sin(2 * th);       // 身体轻微前后摇摆

        const hL = rotatePoint(hipL, PIVOT, tilt * Math.PI / 180);
        const hR = rotatePoint(hipR, PIVOT, tilt * Math.PI / 180);
        hL.y += bob;
        hR.y += bob;

        setT(crankEl, `rotate(${deg(th)} 400 340)`);
        setT(pedalA, `translate(${ax - 13} ${ay - 3.5})`);
        setT(pedalB, `translate(${bx - 13} ${by - 3.5})`);
        setT(footR, `translate(${ax + 2} ${ay - 6})`);
        setT(footL, `translate(${bx + 2} ${by - 6})`);

        const ankleR = { x: ax + 2, y: ay - 9 };
        const ankleL = { x: bx + 2, y: by - 9 };
        const kR = knee(hR, ankleR);
        const kL = knee(hL, ankleL);

        legR.setAttribute("points", `${hR.x},${hR.y} ${kR.x},${kR.y} ${ankleR.x},${ankleR.y}`);
        legL.setAttribute("points", `${hL.x},${hL.y} ${kL.x},${kL.y} ${ankleL.x},${ankleL.y}`);
        kneeR.setAttribute("cx", kR.x);
        kneeR.setAttribute("cy", kR.y);
        kneeL.setAttribute("cx", kL.x);
        kneeL.setAttribute("cy", kL.y);

        setT(spokesR, `translate(300 340) rotate(${deg(wheel)})`);
        setT(spokesF, `translate(540 340) rotate(${deg(wheel)})`);
        setT(rider, `translate(0 ${bob}) rotate(${tilt} 352 246)`);
        setT(headGroup, `rotate(${-1.3 * Math.sin(2 * th + 0.5)} 438 168)`);
        setT(wing, `rotate(${-20 + 14 * Math.sin(t * 2.1)} 412 180)`);
        setT(fish, `rotate(${4 * Math.sin(t * 2.8)} 580 188)`);

        if (!reduced) requestAnimationFrame(update);
      }

      update(last);
    })();
  </script>
</body>
</html>
