# C process termination. Legacy MSVCRT's _exit reaches ExitProcess and may run
# DLL detach cleanup in this raw-PE runtime, so _Exit uses TerminateProcess to
# guarantee immediate termination without flushing CRT streams.
abort=msvcrt.dll|abort|FUNCTION|MSVCRT|WINDOWS_X64|DLL_IMPORT
exit=msvcrt.dll|exit|FUNCTION|MSVCRT|WINDOWS_X64|DLL_IMPORT
craken_immediate_exit=KERNEL32.dll|TerminateProcess|FUNCTION|WINDOWS|WINDOWS_X64|DLL_IMPORT
# Internal, header-private binding used to suppress the Windows error-reporting
# dialog while the native child-process test exercises abort.
craken_set_process_error_mode=KERNEL32.dll|SetErrorMode|FUNCTION|WINDOWS|WINDOWS_X64|DLL_IMPORT

