stdlib.free=FUNCTION|IMPLEMENTED|DLL_DIRECT|INTERPRETED|HEAP|header.free,native.free,debug.free
stdlib.abs=FUNCTION|IMPLEMENTED|DLL_DIRECT|INTERPRETED|NONE|header.abs,native.abs,debug.abs
stdlib.RAND_MAX=CONSTANT|IMPLEMENTED|HEADER_ONLY|HEADER_ONLY|NONE|header.RAND_MAX,native.RAND_MAX,noimport.RAND_MAX

# Opaque CRT streams: source handles stay incomplete and private ABI adapters are not public entities.
stdio.FILE=TYPE|IMPLEMENTED|HEADER_ONLY|HEADER_ONLY|NONE|header.stdio.FILE,native.stdio.FILE,debug.stdio.FILE
stdio.stdin=MACRO|IMPLEMENTED|MINIC_ADAPTER|INTERPRETED|NONE|header.stdin,native.stdin,debug.stdin
stdio.stdout=MACRO|IMPLEMENTED|MINIC_ADAPTER|INTERPRETED|NONE|header.stdout,native.stdout,debug.stdout
stdio.stderr=MACRO|IMPLEMENTED|MINIC_ADAPTER|INTERPRETED|NONE|header.stderr,native.stderr,debug.stderr
stdio.fgetc=FUNCTION|IMPLEMENTED|DLL_DIRECT|INTERPRETED|STDIN;MEMORY|header.fgetc,native.fgetc,debug.fgetc
stdio.fputc=FUNCTION|IMPLEMENTED|DLL_DIRECT|INTERPRETED|STDOUT;STDERR;MEMORY|header.fputc,native.fputc,debug.fputc
stdio.ungetc=FUNCTION|IMPLEMENTED|DLL_DIRECT|INTERPRETED|STDIN;MEMORY|header.ungetc,native.ungetc,debug.ungetc
stdio.fflush=FUNCTION|IMPLEMENTED|DLL_DIRECT|INTERPRETED|STDOUT;STDERR;MEMORY|header.fflush,native.fflush,debug.fflush
# Header adapters own strtod/strtof; UCRT conversion and errno access symbols remain private bindings.
stdlib.strtod=FUNCTION|IMPLEMENTED|MINIC_ADAPTER|INTERPRETED|MEMORY;ERRNO|header.strtod,native.strtod,debug.strtod
stdlib.strtof=FUNCTION|IMPLEMENTED|MINIC_ADAPTER|INTERPRETED|MEMORY;ERRNO|header.strtof,native.strtof,debug.strtof
