# MiniC Windows x64 hosted C23 standard-library profile.
#
# Format: header=status|standard-since|required-capabilities
# Status is one of IMPLEMENTED, PARTIAL, or DEFERRED. A header may only become
# IMPLEMENTED when every entity in the frozen profile has declaration, native,
# debug, and behavior coverage recorded in c23-entities.properties.
assert.mh=DEFERRED|C90|preprocessor;termination;source-location
complex.mh=DEFERRED|C99|complex-types;complex-abi;math
ctype.mh=PARTIAL|C90|ucrt;character-classification
errno.mh=DEFERRED|C90|ucrt;thread-local-state
fenv.mh=DEFERRED|C99|floating-environment
float.mh=PARTIAL|C90|floating-literals;compile-time-constants
inttypes.mh=DEFERRED|C99|integer-types;format-macros;ucrt
iso646.mh=IMPLEMENTED|C95|preprocessor
limits.mh=PARTIAL|C90|integer-types;compile-time-constants
locale.mh=DEFERRED|C90|ucrt;locale-state;struct-layout
math.mh=DEFERRED|C90|ucrt;floating-environment
setjmp.mh=DEFERRED|C90|compiler-intrinsic;non-local-control-flow
signal.mh=DEFERRED|C90|ucrt;callback-abi;signal-state
stdalign.mh=DEFERRED|C11|alignment-semantics
stdarg.mh=DEFERRED|C90|compiler-intrinsic;variadic-abi
stdatomic.mh=DEFERRED|C11|atomic-types;memory-model;atomic-asm
stdbit.mh=DEFERRED|C23|unsigned-types;type-generic-intrinsics
stdbool.mh=IMPLEMENTED|C99|boolean-types;preprocessor
stdckdint.mh=DEFERRED|C23|checked-arithmetic;type-generic-intrinsics
stddef.mh=PARTIAL|C90|core-types;offsetof;alignment
stdint.mh=DEFERRED|C99|fixed-width-integer-types
stdio.mh=PARTIAL|C90|ucrt;formatting;streams;filesystem
stdlib.mh=PARTIAL|C90|ucrt;heap;conversion;callbacks;termination
stdnoreturn.mh=DEFERRED|C11|control-flow-semantics
string.mh=PARTIAL|C90|ucrt;byte-memory
tgmath.mh=DEFERRED|C99|type-generic-dispatch;complex-types
threads.mh=DEFERRED|C11|win32-runtime;threading;synchronization
time.mh=DEFERRED|C90|ucrt;clock;timezone;struct-layout
uchar.mh=DEFERRED|C11|unicode-types;unicode-conversion
wchar.mh=DEFERRED|C95|wide-types;wide-literals;wide-io
wctype.mh=DEFERRED|C95|wide-types;wide-classification
