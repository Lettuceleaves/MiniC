# Public MiniC external symbol = Windows DLL containing the implementation.
ExitProcess=KERNEL32.dll
# These public C entry points are exported directly by the Windows system CRT.
# Modern UCRT headers inline printf/scanf around __stdio_common_* and therefore
# do not export the public spellings that MiniC emits.
malloc=msvcrt.dll
calloc=msvcrt.dll
free=msvcrt.dll
printf=msvcrt.dll
scanf=msvcrt.dll
abs=msvcrt.dll
